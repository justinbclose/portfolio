name: Portfolio stats
# Pulls GA4 numbers every hour (GitHub may delay or skip runs) and saves them, encrypted, to the "stats" branch.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
  push:
    branches: [tick]   # the dashboard sync pokes this branch to get fresh numbers on demand
permissions:
  contents: write
  id-token: write   # keyless sign-in to Google (Workload Identity Federation)
concurrency: stats
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/99372128585/locations/global/workloadIdentityPools/github/providers/portfolio
          service_account: ga4-reader@jbc-portfolio-stats.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-analytics-data google-auth cryptography geonamescache
      - name: Fetch GA4 and encrypt
        env:
          GA4_PROPERTY_ID: "563707397"
          DASH_KEY: ${{ secrets.DASH_KEY }}
          STATS_OUT: ${{ runner.temp }}/stats.enc.json
        run: python analytics/fetch_stats.py
      - name: Save to stats branch (one commit, replaced each run)
        run: |
          [ -f "$RUNNER_TEMP/status.json" ] || { echo "Nothing to save"; exit 0; }
          cd "$RUNNER_TEMP" && rm -rf out && mkdir out && cd out
          if [ -f ../stats.enc.json ]; then cp ../stats.enc.json .
          else git init -q && git fetch -q --depth 1 "https://github.com/${{ github.repository }}.git" stats && git checkout -q FETCH_HEAD -- stats.enc.json || true; fi
          rm -rf .git; git init -q -b stats; cp ../status.json .
          printf '# Encrypted portfolio stats\nWritten by .github/workflows/stats.yml on main. stats.enc.json is readable only with the dashboard passphrase; status.json says whether the last pull worked.\n' > README.md
          git add . && git -c user.name="stats-bot" -c user.email="actions@github.com" commit -qm "stats $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stats
